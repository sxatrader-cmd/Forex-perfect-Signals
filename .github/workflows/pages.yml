name: Pages

on:
  push:
    branches: [main]
  schedule:
    # Every 5 minutes (Saif 2026-11-11). GitHub may delay or skip runs; each run still
    # refreshes news and lets the Python jobs decide what is due from timestamps.
    - cron: "2-59/5 * * * *"
    # Session-open scans (08:00 local, DST-aware; scripts/update_signals.py checks the real local time).
    # Frankfurt 07:00 UTC winter / 06:00 summer, London 08:00 / 07:00, New York 13:00 / 12:00.
    # Two extra tries a few minutes after each possible open, Monday to Friday.
    - cron: "1,8 6,7,8,12,13 * * 1-5"
  workflow_dispatch:
    inputs:
      issue:
        description: Issue a new daily signal now if a pair has no open trade
        type: boolean
        default: false
      news_only:
        description: Refresh the economic calendar only (skip signals, charts, and tests)
        type: boolean
        default: false
      auto:
        description: Sent by the Heartbeat workflow; behaves like a scheduled run (deploys only when data changed)
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      deploy: ${{ steps.meta.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test signal rules
        if: ${{ github.event.inputs.news_only != 'true' }}
        run: python scripts/test_signals.py
      - name: Update economic calendar
        run: python scripts/fetch_news.py
      - name: Update policy rates and high-impact history
        if: ${{ github.event.inputs.news_only != 'true' }}
        run: python scripts/update_macro.py
      - name: Update signals
        if: ${{ github.event.inputs.news_only != 'true' }}
        env:
          FORCE_ISSUE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.issue == 'true' && '1' || '0' }}
          PAUSE_ISSUE: ${{ vars.PAUSE_ISSUE }}
        run: python scripts/update_signals.py
      - name: Post signals to Telegram
        if: ${{ github.event.inputs.news_only != 'true' }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/telegram_signals.py
      - name: Update signal charts
        if: ${{ github.event.inputs.news_only != 'true' }}
        run: python scripts/update_charts.py
      - name: Commit data and decide deploy
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          changed=false
          if [ -n "$(git status --porcelain -- data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            if git diff --cached --quiet -- data/news.json data/signals.json data/history.json data/charts data/macro_calendar.json data/policy_rates.json && ! git diff --cached --quiet -- data/telegram_state.json; then
              msg="data: telegram state [skip ci]"
            elif git diff --cached --quiet -- data/news.json && ! git diff --cached --quiet -- data/signals.json data/history.json data/charts; then
              msg="data: update signals"
            elif ! git diff --cached --quiet -- data/news.json && git diff --cached --quiet -- data/signals.json data/history.json data/charts data/telegram_state.json; then
              msg="data: update economic calendar"
            else
              msg="data: update calendar and signals"
            fi
            git commit -m "$msg"
            # The Live charts workflow pushes chart files to main on its own;
            # rebase onto it (our files win on a clash) before pushing.
            pushed=false
            for try in 1 2 3; do
              if git push origin HEAD:main; then pushed=true; break; fi
              git pull --rebase -X theirs origin main
            done
            [ "$pushed" = "true" ]
            changed=true
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          NEWS_ONLY="${{ github.event.inputs.news_only }}"
          AUTO="${{ github.event.inputs.auto }}"
          if [ "$EVENT_NAME" = "push" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$NEWS_ONLY" != "true" ] && [ "$AUTO" != "true" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif [ "$changed" = "true" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Start live chart updates while a signal is open
        if: ${{ github.event.inputs.news_only != 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python3 -c "import json,sys; o=json.load(open('data/signals.json')).get('open') or []; sys.exit(0 if [s for s in o if s.get('id') not in (None,'empty')] else 1)"; then
            active=$(gh run list --workflow charts.yml --limit 5 --json status -q '[.[] | select(.status!="completed")] | length' || echo 0)
            if [ "${active:-0}" = "0" ]; then gh workflow run charts.yml --ref main; else echo "Live charts already running"; fi
          fi

  deploy:
    needs: prepare
    if: needs.prepare.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Submit URLs to IndexNow
        continue-on-error: true
        run: python3 scripts/indexnow.py
      - name: Save IndexNow state
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- data/indexnow_state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/indexnow_state.json
            git commit -m "data: indexnow state [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
