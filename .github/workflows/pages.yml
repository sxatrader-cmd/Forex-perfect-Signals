name: Pages

on:
  push:
    branches: [main]
  schedule:
    # Every 15 minutes on odd minutes. GitHub may delay or skip runs; each run still
    # refreshes news and lets the Python jobs decide what is due from timestamps.
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:
    inputs:
      issue:
        description: Issue a new daily signal now if a pair has no open trade
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      deploy: ${{ steps.meta.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test signal rules
        run: python scripts/test_signals.py
      - name: Update economic calendar
        run: python scripts/fetch_news.py
      - name: Update policy rates and high-impact history
        run: python scripts/update_macro.py
      - name: Update signals
        env:
          FORCE_ISSUE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.issue == 'true' && '1' || '0' }}
          PAUSE_ISSUE: ${{ vars.PAUSE_ISSUE }}
        run: python scripts/update_signals.py
      - name: Update signal charts
        run: python scripts/update_charts.py
      - name: Commit data and decide deploy
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          changed=false
          if [ -n "$(git status --porcelain -- data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            if git diff --cached --quiet -- data/news.json && ! git diff --cached --quiet -- data/signals.json data/history.json data/charts; then
              msg="data: update signals"
            elif ! git diff --cached --quiet -- data/news.json && git diff --cached --quiet -- data/signals.json data/history.json data/charts; then
              msg="data: update economic calendar"
            else
              msg="data: update calendar and signals"
            fi
            git commit -m "$msg"
            git push origin HEAD:main
            changed=true
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$changed" = "true" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: prepare
    if: needs.prepare.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Submit URLs to IndexNow
        continue-on-error: true
        run: python3 scripts/indexnow.py
      - name: Save IndexNow state
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- data/indexnow_state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/indexnow_state.json
            git commit -m "data: indexnow state [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
